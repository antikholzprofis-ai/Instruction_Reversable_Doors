<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE7">
<title>ANTIK-HOLZ · Installation Guide · Instrukcja · Guide · Anleitung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#F4EFE7;color:#2b2622;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:32px;
  }
  .card{max-width:640px;width:100%;text-align:center}
  .brand{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:34px;color:#2b2622;margin-bottom:6px;
  }
  .brand b{font-style:normal;font-weight:500}
  .eyebrow{
    font-size:12px;letter-spacing:3px;text-transform:uppercase;
    color:#a8853d;margin-bottom:40px;
  }
  .title{
    font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:500;
    line-height:1.3;margin-bottom:8px;
  }
  .sub{font-size:15px;color:#6b6258;margin-bottom:38px}
  .langs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:520px){.langs{grid-template-columns:1fr}}
  a.lang{
    display:block;text-decoration:none;color:#2b2622;
    background:#fff;border:1px solid #e3dccd;border-radius:12px;
    padding:26px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
  }
  a.lang:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 24px rgba(43,38,34,.12);
    border-color:#a8853d;
  }
  .lang-code{
    font-family:'Cormorant Garamond',serif;font-size:40px;
    color:#a8853d;line-height:1;margin-bottom:10px;
  }
  .lang-name{font-size:17px;font-weight:600;margin-bottom:3px}
  .lang-desc{font-size:13px;color:#6b6258}
  .footer{
    margin-top:42px;font-size:12px;letter-spacing:1px;
    text-transform:uppercase;color:#a39a8c;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><b>Antik</b>·Holz</div>
    <div class="eyebrow">Reversible non-rebated doors · № 01</div>

    <h1 class="title">Installation Guide</h1>
    <p class="sub">Wybierz język · Choose your language · Choisir la langue · Sprache wählen</p>

    <div class="langs">
      <a class="lang" href="pl/">
        <div class="lang-code">PL</div>
        <div class="lang-name">Polski</div>
        <div class="lang-desc">Instrukcja montażu</div>
      </a>
      <a class="lang" href="en/">
        <div class="lang-code">EN</div>
        <div class="lang-name">English</div>
        <div class="lang-desc">Installation guide</div>
      </a>
      <a class="lang" href="fr/">
        <div class="lang-code">FR</div>
        <div class="lang-name">Français</div>
        <div class="lang-desc">Guide d'installation</div>
      </a>
      <a class="lang" href="de/">
        <div class="lang-code">DE</div>
        <div class="lang-name">Deutsch</div>
        <div class="lang-desc">Montageanleitung</div>
      </a>
    </div>

    <div class="footer">ANTIK·HOLZ</div>
  </main>
</body>
</html>
